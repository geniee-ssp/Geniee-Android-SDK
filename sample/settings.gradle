pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        // GNAdSDK — local production repo first, so a local publish.sh build can be
        // verified against freshly-built AARs before they are merged to master.
        // Guarded by GN_PRODUCTION_PATH; a no-op for public consumers (env unset).
        def gnProdPath = System.getenv('GN_PRODUCTION_PATH')
        if (gnProdPath) {
            maven {
                url "file://${gnProdPath}/repository"
            }
        }

        // GNAdSDK
        maven {
            url 'https://raw.githubusercontent.com/geniee-ssp/Geniee-Android-SDK/master/repository'
        }

        maven {
            url 'https://artifact.bytedance.com/repository/pangle'
        }
        maven {
            name "Tapjoy's maven repo"
            url 'https://sdk.tapjoy.com/'
        }
        maven {
            url 'https://imobile-maio.github.io/maven'
        }
        maven {
            url 'https://imobile.github.io/adnw-sdk-android'
        }
    }
}

include ':javaSample', ':kotlinSample'
