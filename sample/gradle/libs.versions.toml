[versions]
agp = "8.5.2"
kotlin = "2.2.21"

# GMA Next-Gen SDK (com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk)
gma-next-gen = "1.6.0"
gnadsdk = "8.9.1"
# Google AdMob mediation adapter for GMA Next-Gen SDK
gnadgmanextgengooglemediationadapter = "1.6.0.0"
gnadmaxmediationadapter = "13.6.4.0"
applovin = "13.6.4"

# AndroidX
appcompat = "1.1.0"
constraintlayout = "1.1.3"
recyclerview = "1.3.2"
cardview = "1.0.0"
multidex = "2.0.1"
annotation = "1.1.0"
core-ktx = "1.12.0"

[libraries]
google-ads-mobile-sdk = { group = "com.google.android.libraries.ads.mobile.sdk", name = "ads-mobile-sdk", version.ref = "gma-next-gen" }
gnadsdk = { group = "jp.co.geniee.gnadsdk", name = "GNAdSDK", version.ref = "gnadsdk" }
gnadgmanextgengooglemediationadapter = { group = "jp.co.geniee", name = "GNAdGMANextGenGoogleMediationAdapter", version.ref = "gnadgmanextgengooglemediationadapter" }
gnadmaxmediationadapter = { group = "jp.co.geniee.gnadmaxmediationadapter", name = "GNAdMAXMediationAdapter", version.ref = "gnadmaxmediationadapter" }
applovin-sdk = { group = "com.applovin", name = "applovin-sdk", version.ref = "applovin" }

# AndroidX
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardview" }
multidex = { group = "androidx.multidex", name = "multidex", version.ref = "multidex" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
