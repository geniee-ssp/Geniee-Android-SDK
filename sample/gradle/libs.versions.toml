[versions]
agp = "8.5.2"
kotlin = "2.2.21"

googleads = "25.4.0"
gnadsdk = "8.8.0"

# AndroidX
appcompat = "1.1.0"
constraintlayout = "1.1.3"
recyclerview = "1.3.2"
cardview = "1.0.0"
multidex = "2.0.1"
annotation = "1.1.0"
core-ktx = "1.12.0"

[libraries]
google-play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "googleads" }
gnadsdk = { group = "jp.co.geniee.gnadsdk", name = "GNAdSDK", version.ref = "gnadsdk" }

# AndroidX
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardview" }
multidex = { group = "androidx.multidex", name = "multidex", version.ref = "multidex" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
